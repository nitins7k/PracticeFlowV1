<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PracticeFlowV1 - Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>PracticeFlowV1</h1>
    </header>

    <main>

        <section class="dashboard-card">

            <h2>Teacher Login</h2>

            <form id="loginForm">

                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter teacher email"
                    required
                >

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <p id="loginMessage"></p>

        </section>

    </main>

    <script type="module" src="js/login.js"></script>

</body>
</html>
