<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Worksheets - PracticeFlowV1</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>PracticeFlowV1</h1>

    <nav>
        <a href="index.html">Dashboard</a>
        <a href="worksheets.html">Practice Worksheets</a>
        <a href="notes.html">Notes</a>
    </nav>
</header>

<main>

    <section class="dashboard-card">

        <h2>Upload Practice Worksheet</h2>

        <form id="worksheetForm">

            <label for="classSelect">Class</label><br>
            <select id="classSelect" required>
                <option value="">Select Class</option>
                <option>6</option>
                <option>7</option>
                <option>8</option>
                <option>9</option>
                <option>10</option>
                <option>11</option>
                <option>12</option>
            </select>

            <br><br>

            <label for="subject">Subject</label><br>
            <input
                type="text"
                id="subject"
                placeholder="Enter Subject"
                required
            >

            <br><br>

            <label for="chapter">Chapter Name</label><br>
            <input
                type="text"
                id="chapter"
                placeholder="Enter Chapter Name"
                required
            >

            <br><br>

            <label for="title">Worksheet Title (Optional)</label><br>
            <input
                type="text"
                id="title"
                placeholder="Worksheet Title"
            >

            <br><br>

            <label for="pdfFile">PDF File</label><br>
            <input
                type="file"
                id="pdfFile"
                accept=".pdf"
                required
            >

            <br><br>

            <button type="submit">
                Upload Worksheet
            </button>

        </form>

    </section>

    <section class="dashboard-card">

        <h2>Practice Worksheets</h2>

        <div id="worksheetList">
            <p>No worksheets uploaded yet.</p>
        </div>

    </section>

</main>

<script type="module" src="js/worksheets.js"></script>

</body>
</html>
